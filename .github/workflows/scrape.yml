name: Szukaj mieszkań

on:
  schedule:
    # Co 3 godziny, 8x dziennie. Czas w UTC (Polska/Niemcy to UTC+1 lub UTC+2 latem).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # pozwala odpalić ręcznie z zakładki "Actions" w GitHubie

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write   # potrzebne żeby workflow mógł commitować wyniki z powrotem do repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Zainstaluj przeglądarkę dla Playwright (ImmoScout24)
        run: playwright install --with-deps chromium

      - name: Uruchom bota
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY_PEM: ${{ secrets.VAPID_PRIVATE_KEY_PEM }}
          VAPID_CLAIMS_EMAIL: ${{ secrets.VAPID_CLAIMS_EMAIL }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python main.py --no-save

      - name: Zapisz zrzut ekranu ImmoScout24 (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immoscout24-debug-screenshot
          path: immoscout24_debug.png
          if-no-files-found: ignore

      - name: Zapisz wyniki z powrotem do repo (dla GitHub Pages)
        run: |
          git config user.name "immo-bot"
          git config user.email "immo-bot@users.noreply.github.com"
          git add docs/data/latest.json data/seen_ids.json data/drive_time_cache.json
          # data/job_commute_cache.json (trwały cache czasu dojazdu do OFERT PRACY) może
          # jeszcze NIE ISTNIEĆ na dysku (np. dopóki żadne zapytanie ORS się nie uda w danym
          # przebiegu - patrz utils/geo.py::_save_job_commute_cache(), zapisuje TYLKO po
          # udanym zapytaniu). "git add" z pathspecem, który nie pasuje do żadnego pliku,
          # przerywa CAŁY krok (bash -e) - stąd warunkowe dodanie, tak samo jak w
          # run_immoscout24_local.bat.
          if [ -f data/job_commute_cache.json ]; then git add data/job_commute_cache.json; fi
          git diff --cached --quiet && { echo "Brak zmian - nic do zacommitowania"; exit 0; }
          git commit -m "Aktualizacja ofert $(date -u +'%Y-%m-%d %H:%M UTC')"

          # docs/data/latest.json i data/seen_ids.json to pliki W CAŁOŚCI generowane
          # automatycznie - jeśli w międzyczasie (ręczne uruchomienie, drugi przebieg)
          # ktoś inny zdążył je zmienić i wypchnąć, zwykły "git pull --rebase" może
          # trafić na prawdziwy konflikt treści i wywalić cały krok (a razem z nim
          # dane z TEGO przebiegu, bez ponawiania). Zamiast tego: przy konflikcie
          # świadomie zachowujemy wersję z TEGO przebiegu (ma najświeższe dane -
          # podczas "git rebase" "theirs" to commit odtwarzany, czyli WŁAŚNIE nasz
          # lokalny, świeży commit; "ours" to cel, czyli origin/main) i próbujemy
          # ponownie kilka razy, na wypadek gdyby ktoś zdążył wypchnąć coś jeszcze
          # raz w międzyczasie.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push OK (próba $i)"
                exit 0
              fi
              echo "Push odrzucony mimo udanego rebase (ktoś wypchnął w międzyczasie) - ponawiam (próba $i)..."
              sleep 5
              continue
            fi
            echo "Konflikt podczas rebase w pliku(-ach) z danymi - zachowuję świeżo wygenerowaną wersję z tego przebiegu."
            git checkout --theirs docs/data/latest.json data/seen_ids.json data/drive_time_cache.json 2>/dev/null || true
            git checkout --theirs data/job_commute_cache.json 2>/dev/null || true
            git add docs/data/latest.json data/seen_ids.json data/drive_time_cache.json
            if [ -f data/job_commute_cache.json ]; then git add data/job_commute_cache.json; fi
            if ! git rebase --continue; then
              echo "Rebase nadal się nie udał - poddaję próbę i przerywam."
              git rebase --abort || true
              exit 1
            fi
            sleep 3
          done

          echo "Nie udało się wypchnąć zmian po kilku próbach."
          exit 1
